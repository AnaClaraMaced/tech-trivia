<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tech-trivia</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <section id="start-screen">
        <header>
            <span class="badge"> 💻 Tech Trivia</span>
            <h1 class="logo">
              Verdade ou Bug
            </h1>
            <p class="subtitulo">Curiosidades sobre tecnologia</p>
            
        </header>
        <main>
            <h2>Quanto você realmente conhece sobre o universo da tecnologia?</h2>
    
        <div class="start-row">
            <form>
                <div class="avatar-box">
                            <span class="avatar-title">Escolha seu avatar:</span>
                            <div class="avatar-opcoes">
                                <span class="avatar-item selecionado">👾</span>
                                <span class="avatar-item">🚀</span>
                                <span class="avatar-item">💻</span>
                                <span class="avatar-item">⚡</span>
                            </div>
                        </div>
                <label>Como podemos te chamar?</label>
                <input type="text">
                <button type="submit">Começar Quiz</button>
            </form>

            <ul class="lista-info">
                 <li>❓ 10 perguntas</li>
                 <li>⏱️~3 minutos</li>
                 <li>🏆 Ranking da sessão</li>
             </ul>
             </div>
            </main>
        </section>
    </div>
</body>
</html>
